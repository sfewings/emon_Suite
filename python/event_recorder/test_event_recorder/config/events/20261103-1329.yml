          - "Heel (+ to starboard)"
          - "Pitch (+ bow up)"
        ylabel: "Degrees"

    # Recorded, but not worth a chart of its own. lifetimeCycles is a slowly-rising
    # counter whose chart was a flat line; its last value is in the statistics table
