      - "Main Battery / resCapacity"
      - "Main Battery / lifetimeCycles"
      # A day's motor energy, which the recording's own statistics already cover and
      # which is a single rising line over one sail.
      - "derived/motor/energy/today"
      # The pack's raw signed power. It is still what the energy statistic integrates;
      # it just has no chart of its own, because the Motor and Battery charts both show
