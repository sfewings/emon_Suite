          - "derived/battery/discharge/now"
        right_feeds:
          - "derived/battery/in/today"
          - "derived/battery/out/today"
        ylabel: "Power (W)"
        right_ylabel: "Energy today (Wh)"

      # Attitude, as emon_live publishes it. These are derived feeds now
      # (provisioning/enchantee/emon-ui/derived.yml, ops heel and pitch), not computed
