# Event Recorder - Test Environment
# Self-contained setup for testing event_recorder with MQTT broker and WordPress

services:
  mosquitto:
    image: eclipse-mosquitto
    container_name: test_mqtt
    ports:
      - "1883:1883"
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/logs
      - ./mosquitto-config:/mosquitto/config
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: test_mysql
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    restart: unless-stopped

  wordpress:
    image: wordpress:latest
    container_name: test_wordpress
    ports:
      - "8080:80"
    volumes:
      - wordpress-data:/var/www/html
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins  # Allow KML/GPX uploads
    environment:
      - WORDPRESS_DB_HOST=mysql:3306
      - WORDPRESS_DB_USER=${MYSQL_USER}
      - WORDPRESS_DB_PASSWORD=${MYSQL_PASSWORD}
      - WORDPRESS_DB_NAME=${MYSQL_DATABASE}
      - WP_ENVIRONMENT_TYPE=local
    depends_on:
      - mysql
    restart: unless-stopped

  emon_settings_web:
    image: sfewings32/emon_settings_web:latest
    container_name: test_emon_settings_web
    ports:
      - "5000:5000"
    volumes:
      - ./emon_config:/config
    environment:
      - EMON_CONFIG=/config
      - TZ=${TIMEZONE}
      - FLASK_APP=emon_settings_web.py
    restart: unless-stopped

  event_recorder:
    image: sfewings32/emon_event_recorder:latest
    container_name: test_event_recorder
    # Overrides the image's own CMD, which has --debug --wait-for-debugger baked
    # in. Those are command-line flags, so they win over DEBUG and
    # WAIT_FOR_DEBUGGER in .env: the app called debugpy.wait_for_client() and
    # never started Flask, so localhost:5001 refused every connection while the
    # container sat there "Up". The bind mount below replaces the Python source
    # but not the CMD, so this could not be fixed by editing the source.
    #
    # With the flags gone, .env is authoritative: DEBUG=1 makes debugpy listen on
    # 5678 so VSCode can attach whenever, and WAIT_FOR_DEBUGGER=1 is what makes
    # startup wait for it.
    command:
      - python
      - -m
      - event_recorder.main
      - --config
      - /config/event_recorder_config.yml
      - --events-dir
      - /config/events
      - --data-dir
      - /data
    ports:
      - "5001:5000"
      - "5678:5678"  # debugpy remote debugging
    volumes:
      - ./config:/config
      - ./data:/data
      - ../:/app/event_recorder  # Mount local source for live editing
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - WP_SITE_URL=${WP_SITE_URL}
      - WP_USERNAME=${WP_USERNAME}
      - WP_APP_PASSWORD=${WP_APP_PASSWORD}
      - TZ=${TIMEZONE}
      - DEBUG=${DEBUG:-0}  # Set DEBUG=1 to enable debugpy
      - WAIT_FOR_DEBUGGER=${WAIT_FOR_DEBUGGER:-0}  # Set WAIT_FOR_DEBUGGER=1 to wait for debugger
    depends_on:
      - mosquitto
      - wordpress
    restart: unless-stopped

  # Replays a recorded sail into the test broker, in real time, as the boat's bridge
  # would: legacy topics and emon/... envelopes alike, from the image's own decoder.
  # That is what gives this environment real feed names ('Main Battery / power') rather
  # than invented ones, and it is the only way to exercise the envelope lane without
  # the boat.
  #
  # Under a profile, so `docker compose up -d` still brings up just the stack:
  #     docker compose --profile replay up -d replay      # start the sail
  #     docker compose logs -f replay                     # watch it
  #     docker compose --profile replay down              # or: stop replay
  #
  # The log and the emon_config are the boat's own, mounted read-only out of the
  # repository. The config is what names every feed, so it must be the one that was
  # current when the log was recorded.
  #
  # speed 10 replays the 3 h 20 m sail in about 20 minutes; passes 1 stops at the end
  # rather than looping, so the recording's stop condition can fire.
  replay:
    image: sfewings32/emon_serial_to_mqtt:latest
    container_name: test_replay
    profiles: ["replay"]
    command:
      - python
      - /ab/replay_live.py
      - mosquitto
      - /emon_config/20260211-1447.yml
      - /ab/20260913_Frostbite_1.TXT
      - "10"
      - "1"
    volumes:
      - ../../pyEmon/tests/ab/replay_live.py:/ab/replay_live.py:ro
      - ../../enchantee_racing/tests/data/20260913_Frostbite_1.TXT:/ab/20260913_Frostbite_1.TXT:ro
      - ../../../provisioning/enchantee/emon_config:/emon_config:ro
    environment:
      - TZ=${TIMEZONE}
    depends_on:
      - mosquitto

  # emon_live, for its derived feeds. Attitude, the boat angles and the energy totals
  # are computed here and published on emon/derived/..., and event_recorder records them
  # like any other feed (DESIGN D3: one calculation, not one per consumer). Without this
  # running, a recording has no derived/boat/heel or derived/boat/pitch and the charts
  # asking for them are dropped rather than drawn empty.
  #
  # PUBLISH_DERIVED=1 is what puts them on the broker; the default is off, so a test run
  # does not publish over a real site's feeds. MQTT_CLIENT_ID keeps it away from the id a
  # production instance uses, since the broker evicts a duplicate id (app.py says so, and
  # the race app did exactly that to this stack on 2 Nov 2026).
  #
  # python:3.11-slim with the source mounted rather than sfewings32/emon_live, which is
  # built on the Pi for aarch64 and is not on Docker Hub for this laptop. Dependencies
  # are installed at start, so give it a few seconds longer than the others.
  emon_live:
    image: python:3.11-slim
    container_name: test_emon_live
    ports:
      - "5004:5004"
    volumes:
      - ../../..:/repo:ro
    working_dir: /repo/python/emon_live
    command:
      - sh
      - -c
      - >
        pip install --quiet --root-user-action=ignore -r requirements.txt &&
        python app.py
        --broker mosquitto --broker-port 1883
        --port 5004
        --site /repo/provisioning/enchantee/emon-ui
        --influx none
    environment:
      - TZ=${TIMEZONE}
      - PUBLISH_DERIVED=1
      - MQTT_CLIENT_ID=emon-live-test
    depends_on:
      - mosquitto
    restart: unless-stopped

  # The race app is deliberately NOT a service here. One already runs on this laptop as
  # the `racing_replay` container, published on the host at 5003, and that is what
  # charts.base_url in config/event_recorder_config.yml points at. It subscribes to this
  # stack's broker through the published 1883, so it sees the replay and its UI is live
  # at http://localhost:5003/ while a recording is being made.
  #
  # Adding a second instance here does not work: the app uses a fixed MQTT client id
  # ('enchantee-racing', mqtt_client.py), so two of them take turns evicting each other
  # from the broker, once a second, for ever. If this stack should own the race app,
  # stop racing_replay first.

volumes:
  mosquitto-data:
  mosquitto-logs:
  mysql-data:
  wordpress-data:
