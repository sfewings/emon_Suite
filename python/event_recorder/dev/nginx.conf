# The Pi's front door, as far as the racing app and the recorder use it, for the dev rig's
# `front` profile (dev/README.md). Copied in shape from
# provisioning/enchantee/etc/nginx/sites-available/default: the paths are what the event
# page's back link and the racing app's Log link depend on, and they only work as on the
# boat if they are served as on the boat.
#
# The racing app runs on the host, as its own README has it (python app.py), so it is
# reached as host.docker.internal; the recorder is this compose project's `recorder`.

server {
    listen 80;

    location /race/log/ {
        proxy_pass http://recorder:5000/log/;
        proxy_http_version 1.1;
        proxy_set_header Host            $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100m;
    }
    location = /race/log { return 301 /race/log/; }

    location /race/ {
        proxy_pass http://host.docker.internal:5002/;
        proxy_http_version 1.1;
        proxy_set_header Host            $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /race { return 301 /race/; }

    location /events/ {
        proxy_pass http://recorder:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host            $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100m;
    }
    location = /events { return 301 /events/; }
}
