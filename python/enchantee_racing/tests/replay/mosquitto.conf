# Mosquitto for replaying recorded races into the app. Test use only.
#
# Anonymous and unauthenticated, like the broker on the boat. Persistence is off
# deliberately: a replay should start from nothing, and a retained value left over from
# a previous run would show up on the HUD as a reading that never arrived.

listener 1883
allow_anonymous true

persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
