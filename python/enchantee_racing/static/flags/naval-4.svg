<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 60" role="img"
     aria-label="Naval numeral 4, division">
  <title>Naval numeral 4, division</title>
  <defs><clipPath id="p"><rect x="0" y="0" width="90" height="60"/></clipPath></defs>
  <rect x="0" y="0" width="90" height="60" fill="#c8102e"/>
  <g clip-path="url(#p)" stroke="#ffffff" stroke-width="11">
    <line x1="0" y1="0" x2="90" y2="60"/>
