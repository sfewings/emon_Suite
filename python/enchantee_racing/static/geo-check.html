<!doctype html>
<!--
  Does static/geo.js agree with engine/nav.py? Open by URL:

      http://enchantee.local/race/static/geo-check.html

  geo.js is a transcription of nav.py's projection, not a reimplementation, because the
  map and the engine have to place a point identically: the engine decides which leg the
  boat is on and whether it has crossed the line, the map draws all of that, and a
  disagreement between them would look like bad mark data and would not be
  (DESIGN 12.1, build step 2).

  static/geo-fixture.json is what nav.py says, generated by scripts/gen_geo_fixture.py.
  This page checks every value in it and prints the worst error found. Run it once after
  touching either file. It is also worth running on the boat's iPad, not because float64
  differs there but because that is the browser everything else has surprised us on.

  Self-contained, and no clamp() or flexbox gap, because iOS 12 has neither and this page
  is worth running on the device. The var-and-function style is house style rather than a
  requirement: Safari 12 handles ES6.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projection check</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; color: #fff;
               font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  body { padding: 12px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { font-size: 13px; color: #bbb; margin: 6px 0; }
  #verdict { font-size: 22px; font-weight: 700; margin: 12px 0; }
  .ok { color: #98fb98; }
  .bad { color: #ff6b6b; }
  table { border-collapse: collapse; font-size: 13px; width: 100%; }
  th, td { text-align: left; padding: 3px 8px 3px 0; border-bottom: 1px solid #222; }
  th { color: #767676; font-weight: 600; }
  td.n { font-variant-numeric: tabular-nums; }
</style>

<h1>Projection check</h1>
<p>static/geo.js against engine/nav.py, via static/geo-fixture.json.</p>

<div id="verdict">running...</div>
<table id="results"><tbody></tbody></table>

<script src="geo.js"></script>
<script>
(function () {
  var verdict = document.getElementById("verdict");
  var body = document.querySelector("#results tbody");

  function row(name, checked, worst, unit, where, ok) {
    var tr = document.createElement("tr");
    function cell(text, cls) {
      var td = document.createElement("td");
      if (cls) td.className = cls;
      td.textContent = text;
      tr.appendChild(td);
    }
    cell(name);
    cell(String(checked), "n");
    cell(worst.toExponential(2) + " " + unit, "n");
    cell(where);
    cell(ok ? "ok" : "FAIL", ok ? "ok" : "bad");
    body.appendChild(tr);
  }

  var head = document.createElement("tr");
  ["check", "values", "worst error", "at", ""].forEach(function (h) {
    var th = document.createElement("th");
    th.textContent = h;
    head.appendChild(th);
  });
  body.appendChild(head);

  fetch("geo-fixture.json", { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("fixture http " + r.status);
      return r.json();
    })
    .then(function (fix) {
      var failures = 0;

      // --- metres per degree -------------------------------------------------
      var worst = 0, at = "";
      fix.metres_per_degree.forEach(function (c) {
        var got = Geo.metresPerDegree(c.lat);
        [[got.lat, c.m_lat, "lat"], [got.lon, c.m_lon, "lon"]].forEach(function (p) {
          var err = Math.abs(p[0] - p[1]);
          if (err > worst) { worst = err; at = "lat " + c.lat + " " + p[2]; }
        });
      });
      var ok = worst <= fix.tolerance_m;
      if (!ok) failures++;
      row("metresPerDegree", fix.metres_per_degree.length * 2, worst, "m", at, ok);

      // --- enu, every mark and both bbox corner sets --------------------------
      worst = 0; at = "";
      fix.enu.forEach(function (c) {
        var got = Geo.enu(fix.origin, { lat: c.lat, lon: c.lon });
        var err = Math.max(Math.abs(got.e - c.e), Math.abs(got.n - c.n));
        if (err > worst) { worst = err; at = c.id; }
      });
      ok = worst <= fix.tolerance_m;
      if (!ok) failures++;
      row("enu", fix.enu.length, worst, "m", at, ok);

      // --- norm180, which is where the two languages genuinely differ ---------
      worst = 0; at = "";
      fix.norm180.forEach(function (c) {
        var err = Math.abs(Geo.norm180(c.deg) - c.want);
        if (err > worst) { worst = err; at = c.deg + " deg"; }
      });
      ok = worst <= fix.tolerance_deg;
      if (!ok) failures++;
      row("norm180", fix.norm180.length, worst, "deg", at, ok);

      if (failures === 0) {
        verdict.textContent = "PASS: geo.js matches nav.py";
        verdict.className = "ok";
      } else {
        verdict.textContent = "FAIL: " + failures + " check(s) disagree with nav.py";
        verdict.className = "bad";
      }
    })
    .catch(function (e) {
      verdict.textContent = "FAIL: " + e;
      verdict.className = "bad";
    });
}());
</script>
