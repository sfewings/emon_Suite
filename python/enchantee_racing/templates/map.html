<!doctype html>
<!--
  Course map. The third screen (DESIGN 9.6), its own page rather than a panel on the race
  screen, for the reasons in DESIGN 12.1: the panel would have inherited the race screen's
  poll, navigation, theme and wake lock for nothing, but a map is 88 kB of chart data plus
  projection and gesture code that a crew watching a countdown never needs.

  Unlike hud.html this page is NOT self-contained. That one inlines its CSS and script for
  one reason recorded in DESIGN 9.1, that it was ported from Node-RED close to verbatim so
  the two could be compared side by side. This page has no original, so it takes
  static/app.css and static/map.js and only the head block and the navigation are
  duplicated markup.

  Asset URLs are relative, not root-relative, on purpose: this page is served at /race/map
  behind nginx and at /map on the app's own port, and a leading slash breaks the prefixed
  case. The chart data is fetched from api/config/<name> built the same way (CLAUDE.md).
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">  <!-- relative: scopes both screens into
     one iOS standalone window, so tapping between them does not open a browser
     (DESIGN 9.8.1) -->
<link rel="apple-touch-icon" href="static/icon-180.png">
<title>Enchantee map</title>
<link rel="stylesheet" href="static/app.css">
<!-- Before the body, so --app-h is set before #app is first laid out and there is no
     flash of the wrong height. See the file for why CSS alone cannot do this. -->
<script src="static/viewport.js"></script>

<div id="app">
  <section class="panel" id="panel-map">
    <!--
      One svg, viewBox in projected metres east and north of the start line's inner end,
      so panning and zooming move the viewBox and never re-project the geometry
      (DESIGN 12.1). preserveAspectRatio keeps the scale square: a map that stretches is
      worse than no map, because a bearing read off it would be wrong.

      Groups in draw order, bottom first, exactly as DESIGN 12 states: depth bands, then
      the contours that divide them, then land over the top of both, then the marks and
      the course over everything.
    -->
    <!--
      The caveats. They were a visible line under the chart and are now the chart's own
      description: the crew asked for that strip for numbers, and after a season of looking
      at the same sentence every time the screen is opened it had stopped being read. It is
      still in the document, still says exactly what the sources say, and DESIGN 12 carries
      it in full.

      The datum sentence is the one that matters and it used to be wrong. It said "depths
      below low water", which reads as conservative. The soundings are on AHD, roughly mean
      sea level, so at low water there is LESS water than the contours say, by up to about
      0.76 m at LAT, and a charted 2 m contour is not this 2 m contour. DESIGN 12 records
      the two numeric comparisons that settled it against what the survey metadata appeared
      to say. Corrected here in the strongest words that fit.
    -->
    <svg id="chart" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid meet"
         aria-label="Course map" aria-describedby="map-caveat">
      <desc id="map-caveat">Orientation only, not for navigation. Depths are on AHD, near
        mean sea level, NOT chart datum: at low water there is less water than shown, by up
        to 0.76 m. Soundings from the 2010 river multibeam and the Department of Transport
        regional surveys; banks from OpenStreetMap. Nothing here shows sandbanks.</desc>
      <g id="layer-bands"></g>
      <g id="layer-contours"></g>
      <g id="layer-land"></g>
      <!--
        Structures then navaids, between the land and the marks, which is the draw order
        DESIGN 12 states. Jetties are what the crew actually steers by, being big, fixed
        and lit, so they go over the land they stand on; the aid network goes over them.
      -->
      <g id="layer-structures"></g>
      <g id="layer-navaids"></g>
      <g id="layer-lines"></g>
      <g id="layer-marks"></g>
      <!--
        The course being sailed and the boat, over everything, because they are the only
        things on this page that change and the only ones the crew is looking for. Empty
        until /api/state says there is a race and a fix (DESIGN 12.1 step 5).
      -->
      <g id="layer-course"></g>
      <g id="layer-boat"></g>
    </svg>

    <!--
      One control (CLAUDE.md: minimum interaction). It names the extent that is on the
      screen and cycles to the next one, and once the chart has been pinched or dragged it
      says FIT instead and comes back to that same extent first. So the tap that recovers a
      map dragged somewhere useless is always the next tap, which is the one property of
      the old Fit button worth keeping. Free pan and pinch sit on top of it.

      Empty in the markup: the label is the current extent's name and only map.js knows
      which that is (DESIGN 12.2).
    -->
    <div class="controls">
      <button id="map-zoom" class="primary"></button>
    </div>

    <!--
      Four readings, in the space the caveat used to have. Which four depends on what the
      boat is doing, and map.js fills all of it, labels and units included: a map with no
      numbers on it sends the crew back to the other two screens for the one thing they
      needed while looking at it (DESIGN 12.2).

      The cells are in the markup rather than built, so the strip is the same height before
      the first poll as after it and the chart above it is never resized by data arriving.
    -->
    <div id="map-readout">
      <div class="cell"><span class="lbl"></span><span class="val">---</span><span class="unit"></span></div>
      <div class="cell"><span class="lbl"></span><span class="val">---</span><span class="unit"></span></div>
      <div class="cell"><span class="lbl"></span><span class="val">---</span><span class="unit"></span></div>
      <div class="cell"><span class="lbl"></span><span class="val">---</span><span class="unit"></span></div>
    </div>
  </section>

  <!-- The theme is the fourth cell on all three screens, and its label is written by
       theme.js. See index.html's nav for why it is here and not on a panel. -->
  <nav id="nav">
    <a href="hud">HUD</a>
    <a href=".">Race</a>
    <a class="here">Map</a>
    <button data-theme-toggle></button>
  </nav>
</div>

<script src="static/theme.js"></script>
<script src="static/geo.js"></script>
<script src="static/map.js"></script>
