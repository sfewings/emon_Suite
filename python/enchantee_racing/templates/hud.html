<!DOCTYPE html>
<html lang="en">
<head>
<!--
  Instrument HUD, ported from the Node-RED flow: the "HUD page" template node
  (hud0000000000031) on the Sailing HUD tab of docs/reference/flows.json, which served
  it at /hud from an http-in node. Ported close to verbatim, per DESIGN 9.1: the page
  is good, and the crew should not have to relearn a display they already read at a
  glance in the wet.

  flows.json is the only current description of this page. docs/reference/HUD.png
  predates changes to the colours and to the order of the readings, so it must not be
  used as a reference for either.

  Kept unchanged from the original: the {v, age} envelope and stale handling, the
  15 s stale threshold, the 500 ms poll, the colour variables, the panel order, the
  fit() that sizes digits to their cell, the motor panel swap with both row sets
  pre-rendered and a class toggled, the connection pip, the safe-area insets,
  overscroll-behavior, user-select and touch-action, and the data URL built from
  location.pathname so the page works behind the /race/ prefix, on its own port, and
  under mDNS, AP mode or a raw IP alike.

  Deliberately self-contained: no external stylesheet, no external script, no font and
  no image. The Pi has no internet, so a page that fetches anything off-box is a page
  that hangs. static/app.css and static/app.js are for the race screen.

  Changed from the original: nothing in the display. The 10 s motor hold now lives
  server-side in store.py, where the original had it in the "Latest values as JSON"
  function node, so this page still just renders d.motor.

  Changed from the original, and the one behavioural fix in the port: the screen now
  actually stays awake. The original called navigator.wakeLock, which requires a secure
  context, so over plain HTTP it was refused and the screen slept mid-race. A hidden
  looping muted video does work over plain HTTP on both iOS and Android (DESIGN 9.8).
  Both are in place: the API when a secure context ever exists, the video meanwhile.

  Also added: the three-screen navigation along the bottom, HUD, Race and Map. The Node-RED
  page had nowhere to go, and without it a phone that lands here is stuck. href="." rather
  than "/" so it resolves to /race/ behind the nginx prefix and to / on the app's own port,
  the same reason every other asset path here is relative.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">  <!-- relative: resolves to /race/ behind nginx and / on the app's own port.
     Declares the scope that keeps both screens in one iOS standalone window;
     apple-mobile-web-app-capable above is what iOS 12 reads instead. -->
<title>Enchantee HUD</title>
<style>
  /* Colours match the readings on the dashboard pages: speeds DodgerBlue,
     wind angles Orange, heading Yellow. The apparent (and course) row of each
     pair is tinted lighter so the two rows in a panel stay apart at a glance. */
  :root {
    --sog:   #1e90ff;   /* speed over ground   - as Navigation 'Speed'          */
    --twa:   #ffa500;   /* true wind angle     - as Weather 'True Wind Dir'     */
    --awa:   #ffcc80;   /* apparent wind angle - lighter tint of that orange    */
    --tws:   #1e90ff;   /* true wind speed     - as Weather 'True Wind Speed'   */
    --aws:   #8fc9ff;   /* apparent wind speed - lighter tint of that blue      */
    --hdg:   #ffff00;   /* heading             - as Navigation 'Heading'        */
    --cog:   #ffff99;   /* course over ground  - lighter tint of that yellow    */
    --mark:  #ffffff;   /* next mark name      - as the race screen (DESIGN 9.10) */
    /* motor readings, coloured as they are on the SevCon page */
    --rpm:   #98fb98;   /* PaleGreen  - SevCon 'RPM'                            */
    --cur:   #00ffff;   /* Cyan       - SevCon 'Current'                        */
    --ctrl:  #ff0000;   /* Red        - SevCon 'Controller Temperature'         */
    --mot:   #b22222;   /* FireBrick  - SevCon 'Motor Temperature'              */
    --rule:  #262626;   /* panel divider           */
    --label: #767676;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #000; color: #fff;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
  }
  #hud {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .panel {
    flex: 1 1 0;
    display: flex; flex-direction: column;
    border-bottom: 2px solid var(--rule);
    min-height: 0;
  }
  .panel:last-child { border-bottom: none; }

  /* label gutter | value | unit gutter */
  .row {
    flex: 1 1 0;
    display: grid;
    grid-template-columns: 4.2em 1fr 3.6em;
    align-items: center;
    min-height: 0;
    font-size: 1.7vh; font-size: clamp(9px, 1.7vh, 18px);   /* sets the gutter widths and label size */
  }
  .lbl, .unit {
    color: var(--label);
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 0 0.6em;
  }
  .lbl  { align-self: start; padding-top: 0.9em; }
  .unit { align-self: end; padding: 0 0.5em 0.9em 0.3em; text-align: right; }

  .cell { overflow: hidden; text-align: right; min-width: 0; }
  .val {
    display: inline-block;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
    letter-spacing: -0.02em;
    line-height: 1;
    white-space: nowrap;
    transition: opacity .2s;
  }
  .stale { opacity: 0.25; }
  .row.off { display: none; }   /* the panel set that is not in use */

  /* The racing rows in panel 4, which carry more than one reading each and so cannot use
     the label | value | unit gutters the rest of the page is built on (DESIGN 9.10). Each
     value keeps .val directly inside a .cell, because fit() sizes a value against its
     cell's width and its row's height and there is no reason to teach it a second shape.

     The label sits above the value with the unit at the other end of the same line, so
     the unit still reads as a unit without needing a gutter of its own. */
  .row.multi { grid-template-columns: repeat(3, 1fr); }
  .row.multi.two { grid-template-columns: 1.7fr 1fr; }
  .row.multi .cell {
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 0.6em; min-width: 0;
  }
  .row.multi .sub {
    display: flex; justify-content: space-between;
    color: var(--label); letter-spacing: .1em; text-transform: uppercase;
    white-space: nowrap; overflow: hidden;
  }
  /* The mark name is a name, not a number: it is left-aligned, it is not tabular, and it
     ellipsises rather than shrinking away to nothing on a long one. */
  .row.multi .cell.name { text-align: left; }
  .row.multi .val.name {
    font-variant-numeric: normal; font-feature-settings: normal;
    font-size: 3.6vh; font-size: clamp(15px, 3.6vh, 44px);
    overflow: hidden; text-overflow: ellipsis;
  }

  /* connection pip - only visible once the data stops arriving */
  #pip {
    position: fixed; top: calc(env(safe-area-inset-top) + 7px); left: 7px;
    width: 9px; height: 9px; border-radius: 50%;
    background: #e8443a; opacity: 0; transition: opacity .3s;
    pointer-events: none;
  }
  #pip.down { opacity: 1; }

  /* The same three-screen navigation the race screen carries, so no screen is a dead end
     (DESIGN 9.6). Fixed to the bottom rather than added to #hud's flex column, so the
     panel sizing this port depends on is left exactly as it was; #hud only has room made
     for it below. */
  #nav {
    position: fixed; z-index: 2;
    left: env(safe-area-inset-left); right: env(safe-area-inset-right);
    bottom: env(safe-area-inset-bottom);
    display: flex;
    border-top: 2px solid var(--rule);
    background: #000;
  }
  /* Margins rather than flexbox gap, which needs Safari 14.1 and is ignored on the
     iPad mini 3's iOS 12. static/app.css does the same for the race page. */
  #nav > * + * { margin-left: 1px; }
  .row.multi .sub > * + * { margin-left: .4em; }
  #nav a {
    flex: 1 1 0; min-height: 2.6rem; min-width: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--label); text-decoration: none;
    font-size: 1.9vh; font-size: clamp(10px, 1.9vh, 17px);
    font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  }
  #nav a:active { background: var(--rule); }
  #nav a.here { color: #fff; box-shadow: inset 0 3px 0 0 var(--sog); }
  #nav a.off { opacity: .3; pointer-events: none; }
  #hud { padding-bottom: calc(env(safe-area-inset-bottom) + 2.6rem); }

  /* The wake-lock video has to be playing and on the page, but never seen. Deliberately
     not display:none and not visibility:hidden: a browser that considers the element
     invisible is entitled to stop decoding it, and a video that is not being decoded is
     not a reason to keep the backlight on. One transparent pixel behind everything. */
  #wake {
    position: fixed; top: 0; left: 0;
    width: 1px; height: 1px;
    opacity: 0; z-index: -1;
    pointer-events: none;
  }

  @media (orientation: landscape) {
    #hud { flex-direction: row; }
    .panel { border-bottom: none; border-right: 2px solid var(--rule); }
    .panel:last-child { border-right: none; }
    /* Four panels across means the racing cells are a quarter of the screen wide, split
       three ways. Tighten the labels rather than let "off the bow" clip (DESIGN 9.10). */
    .row.multi .sub { font-size: .88em; letter-spacing: .04em; padding: 0; }
    .row.multi .cell { padding: 0 .35em; }
  }
</style>
</head>
<body>
<!-- src is relative, not root-relative: this page is served at /race/hud behind nginx
     and at /hud on its own port, and a leading slash breaks the prefixed case. -->
<video id="wake" src="static/wake.mp4" muted loop playsinline webkit-playsinline
       preload="auto" disableremoteplayback></video>
<div id="pip"></div>
<nav id="nav">
  <a class="here">HUD</a>
  <a href=".">Race</a>
  <a class="off" aria-disabled="true">Map</a>
</nav>
<div id="hud">
  <div class="panel">
    <div class="row"><span class="lbl">SOG</span><span class="cell"><span class="val" id="sog" style="color:var(--sog)">--.-</span></span><span class="unit">kt</span></div>
  </div>
  <div class="panel">
    <div class="row" data-mode="sail"><span class="lbl">TWA</span><span class="cell"><span class="val" id="twa" style="color:var(--twa)">---</span></span><span class="unit">deg</span></div>
    <div class="row" data-mode="sail"><span class="lbl">AWA</span><span class="cell"><span class="val" id="awa" style="color:var(--awa)">---</span></span><span class="unit">deg</span></div>
    <div class="row off" data-mode="motor"><span class="lbl">RPM</span><span class="cell"><span class="val" id="rpm" style="color:var(--rpm)">---</span></span><span class="unit">rpm</span></div>
    <div class="row off" data-mode="motor"><span class="lbl">AMP</span><span class="cell"><span class="val" id="cur" style="color:var(--cur)">--.-</span></span><span class="unit">A</span></div>
  </div>
  <div class="panel">
    <div class="row" data-mode="sail"><span class="lbl">TWS</span><span class="cell"><span class="val" id="tws" style="color:var(--tws)">--.-</span></span><span class="unit">kt</span></div>
    <div class="row" data-mode="sail"><span class="lbl">AWS</span><span class="cell"><span class="val" id="aws" style="color:var(--aws)">--.-</span></span><span class="unit">kt</span></div>
    <div class="row off" data-mode="motor"><span class="lbl">CTRL</span><span class="cell"><span class="val" id="ctrl" style="color:var(--ctrl)">---</span></span><span class="unit">&deg;C</span></div>
    <div class="row off" data-mode="motor"><span class="lbl">MOT</span><span class="cell"><span class="val" id="mot" style="color:var(--mot)">---</span></span><span class="unit">&deg;C</span></div>
  </div>
  <!-- Panel 4 carries two row sets, the way panels 2 and 3 do. HDG and COG whenever there
       is no race running, and the mark the boat is sailing to while there is: a phone on
       the HUD is a phone that cannot see the race screen, and the instruments and the mark
       are the two things wanted at once. HDG is what that costs, because COG stands in for
       it whenever the boat is moving (DESIGN 9.10). -->
  <div class="panel">
    <div class="row" data-race="off"><span class="lbl">HDG</span><span class="cell"><span class="val" id="hdg" style="color:var(--hdg)">---</span></span><span class="unit">deg</span></div>
    <div class="row" data-race="off"><span class="lbl">COG</span><span class="cell"><span class="val" id="cog" style="color:var(--cog)">---</span></span><span class="unit">deg</span></div>
    <div class="row multi two off" data-race="on">
      <span class="cell name"><span class="sub"><span>next mark</span></span><span class="val name" id="r-mark" style="color:var(--mark)">---</span></span>
      <span class="cell"><span class="sub"><span>distance</span><span id="r-dist-unit">m</span></span><span class="val" id="r-dist" style="color:var(--sog)">---</span></span>
    </div>
    <!-- No "deg" on these three. All three are degrees, the numbers say so on sight, and
         in landscape the four panels sit side by side where "off the bow" needs every
         pixel of its cell. The distance keeps its unit, because m and nm both occur. -->
    <div class="row multi off" data-race="on">
      <span class="cell"><span class="sub"><span>bearing</span></span><span class="val" id="r-brg" style="color:var(--hdg)">---</span></span>
      <span class="cell"><span class="sub"><span>cog</span></span><span class="val" id="r-cog" style="color:var(--cog)">---</span></span>
      <span class="cell"><span class="sub"><span>off the bow</span></span><span class="val" id="r-rel" style="color:var(--hdg)">---</span></span>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var POLL_MS = 500;   // how often we ask the server for fresh values
  var STALE_S = 15;    // dim a value once its last MQTT message is this old

  var FIELDS = {
    sog: fmt1,
    twa: fmtSigned,
    awa: fmtSigned,
    tws: fmt1,
    aws: fmt1,
    hdg: fmt3,
    cog: fmt3,
    rpm: fmtSigned,     // shown instead of the wind panels while motoring
    cur: fmt1,
    ctrl: fmtSigned,
    mot: fmtSigned
  };
  var BLANK = { sog: "--.-", tws: "--.-", aws: "--.-", cur: "--.-" };

  function fmt1(v)      { return v.toFixed(1); }
  function fmtSigned(v) { return String(Math.round(v)); }
  function fmt3(v)      { return ("00" + ((((Math.round(v) % 360) + 360) % 360))).slice(-3); }

  var el = {};
  Object.keys(FIELDS).forEach(function (k) { el[k] = document.getElementById(k); });
  var pip = document.getElementById("pip");

  // Digits are sized to fill their cell: start from the row height, then shrink
  // if the text is wider than the space between the label and unit gutters.
  function fit(node) {
    var cell = node.parentElement;
    var row = cell.parentElement;
    var h = row.clientHeight;          // the cell itself is only as tall as its text
    var avail = cell.clientWidth;
    if (!h || !avail) return;
    // A racing row spends part of its height on the label above the value, so its numbers
    // get a smaller share of the row than the full-width ones do (DESIGN 9.10).
    var px = Math.floor(h * (row.classList.contains("multi") ? 0.5 : 0.82));
    node.style.fontSize = px + "px";
    var w = node.getBoundingClientRect().width;
    if (w > avail) {
      node.style.fontSize = Math.floor(px * avail / w) + "px";
    }
  }
  function fitAll() {
    Object.keys(el).forEach(function (k) { fit(el[k]); });
    // the racing rows too, when they are the set on show (DESIGN 9.10)
    Object.keys(race).forEach(function (k) {
      if (fittable(race[k])) fit(race[k]);
    });
  }

  // Panels 2 and 3 carry two sets of rows: the wind readings, and the motor
  // readings shown in their place while the SevCon is turning. The server decides
  // which set is live, and holds the swap for 10 s so a lumpy idle cannot flip the
  // panels back and forth; only the rows on show are laid out.
  var rows = document.querySelectorAll(".row[data-mode]");
  var motorMode = false;
  function setMode(motor) {
    motor = !!motor;
    if (motor === motorMode) return false;
    motorMode = motor;
    Array.prototype.forEach.call(rows, function (r) {
      r.classList.toggle("off", (r.getAttribute("data-mode") === "motor") !== motor);
    });
    return true;
  }

  // Panel 4 swaps the same way: HDG and COG when no race is running, the mark being
  // sailed to while one is (DESIGN 9.10). Racing only, so the heading is still there to
  // sit on before the gun and after the finish.
  var raceRows = document.querySelectorAll(".row[data-race]");
  var raceMode = false;
  function setRacing(racing) {
    racing = !!racing;
    if (racing === raceMode) return false;
    raceMode = racing;
    Array.prototype.forEach.call(raceRows, function (r) {
      r.classList.toggle("off", (r.getAttribute("data-race") === "on") !== racing);
    });
    return true;
  }

  // The racing readings. Kept out of FIELDS because they are not {v, age} instrument
  // readings: they are derived from the race and the fix, and they blank rather than dim
  // when the fix goes stale (DESIGN 9.5).
  var race = {};
  ["r-mark", "r-dist", "r-dist-unit", "r-brg", "r-cog", "r-rel"].forEach(function (k) {
    race[k] = document.getElementById(k);
  });
  var NM_ABOVE_M = 500, METRES_TO_NM = 1 / 1852;

  // The mark name is sized by CSS and ellipsised, not fitted: fit() shrinks text until it
  // fits its cell, which is right for a three-digit number and useless for a long name.
  function fittable(node) {
    return node.classList.contains("val") && !node.classList.contains("name");
  }

  function put(node, text) {
    if (node.textContent === text) return;
    node.textContent = text;
    if (fittable(node)) fit(node);
  }

  function paintRace(data) {
    var r = data.race || null;
    // nav is null before the first fix and once it is more than 5 s old, which is exactly
    // when none of these three can be known.
    var nav = (r && r.nav) || null;
    put(race["r-mark"], (r && r.leg_name) || "---");
    if (nav && nav.distance_m !== null && nav.distance_m !== undefined) {
      // metres under 500, nautical miles above, as the race screen (DESIGN 9.4)
      if (nav.distance_m < NM_ABOVE_M) {
        put(race["r-dist"], String(Math.round(nav.distance_m)));
        put(race["r-dist-unit"], "m");
      } else {
        put(race["r-dist"], (nav.distance_m * METRES_TO_NM).toFixed(2));
        put(race["r-dist-unit"], "nm");
      }
    } else {
      put(race["r-dist"], "---");
    }
    put(race["r-brg"], nav ? fmt3(nav.bearing) : "---");
    put(race["r-rel"], nav ? fmtSigned(nav.relative) : "---");

    // COG is an instrument reading here, not a derived one, so it keeps the 15 s dim.
    var cog = data.fields.cog;
    var live = cog && cog.v !== null && cog.v !== undefined && isFinite(cog.v);
    put(race["r-cog"], live ? fmt3(cog.v) : "---");
    race["r-cog"].classList.toggle("stale", !cog || cog.age > STALE_S);
  }

  function paint(data) {
    Object.keys(FIELDS).forEach(function (k) {
      var f = data.fields[k];
      var node = el[k];
      var text = (f && f.v !== null && f.v !== undefined && isFinite(f.v))
        ? FIELDS[k](f.v)
        : (BLANK[k] || "---");
      if (node.textContent !== text) {
        node.textContent = text;
        fit(node);
      }
      node.classList.toggle("stale", !f || f.age > STALE_S);
    });
  }

  var failures = 0;
  function tick() {
    // The page can be served behind a proxy prefix (eg /race/hud or /nodered/hud), so
    // build the data URL from wherever this page actually lives. /api/state rather than
    // the original's /data, because the racing panel needs race state and that is where
    // it lives; /hud/data still serves the shape the Node-RED flow did (DESIGN 9.10).
    var url = location.pathname.replace(/\/+$/, "").replace(/\/hud$/, "") + "/api/state";
    fetch(url, { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        failures = 0;
        pip.classList.remove("down");
        var swapped = setMode(d.motor);
        swapped = setRacing(d.race && d.race.mode === "racing") || swapped;
        paint(d);
        paintRace(d);
        if (swapped) fitAll();   // rows that were hidden had no size to fit to
      })
      .catch(function () { if (++failures > 3) pip.classList.add("down"); });
  }

  fitAll();
  window.addEventListener("resize", fitAll);
  window.addEventListener("orientationchange", function () { setTimeout(fitAll, 250); });

  setInterval(tick, POLL_MS);
  tick();
  document.addEventListener("visibilitychange", function () { if (!document.hidden) tick(); });

  // Keep the phone screen alive while the HUD is up. Two mechanisms, because neither
  // covers this deployment on its own.
  //
  // The Screen Wake Lock API is the right one and is kept from the original page, but
  // it requires a secure context: over plain HTTP the request is refused, so on this
  // boat it has never done anything. It costs nothing and starts working the day there
  // is TLS.
  var lock = null;
  function requestLock() {
    if (!("wakeLock" in navigator) || lock) return;
    navigator.wakeLock.request("screen").then(function (l) {
      lock = l;
      l.addEventListener("release", function () { lock = null; });
    }).catch(function () {});
  }

  // What actually works here: a hidden looping muted video, which iOS and Android both
  // treat as a reason to keep the backlight on, and which needs no secure context
  // (DESIGN 9.8). It must be started from a user gesture, so the tap handler below is
  // what gets it going; there is no way to start it unprompted and no point trying.
  var wake = document.getElementById("wake");
  var wakeStarted = false;
  function playWake() {
    if (!wake) return;
    var playing = wake.play();
    if (playing && playing.then) {
      playing.then(function () { wakeStarted = true; }).catch(function () {});
    }
  }
  if (wake) {
    // iOS pauses the video when the page goes to the background and does not resume it
    // when the page comes back. Only chase it once it has legitimately started, or a
    // refused autoplay turns into a retry loop.
    wake.addEventListener("pause", function () { if (wakeStarted) playWake(); });
  }

  function keepAwake() { requestLock(); playWake(); }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) keepAwake(); });

  // Cross-page navigation goes through location.assign, not through the anchor.
  //
  // Same handler as static/app.js, and for the same reason: added to the Home Screen
  // this page runs in iOS's standalone context, and following a real anchor to a
  // different document is treated as leaving the web app, so iOS reopens it in an
  // in-app browser with a Done button and a toolbar top and bottom. Assigning location
  // from script stays inside the standalone context.
  //
  // The href stays on the anchor and only the default action is cancelled, so the link
  // still resolves relatively against the document, which is what keeps it right both
  // behind /race/ and on the app's own port. A test checks this page and app.js against
  // each other, because fixing one direction and not the other would throw the crew out
  // of the app going one way only.
  Array.prototype.forEach.call(document.querySelectorAll("#nav a[href]"), function (a) {
    a.addEventListener("click", function (event) {
      event.preventDefault();
      location.assign(a.href);
    });
  });

  // tap anywhere for fullscreen
  document.body.addEventListener("click", function () {
    keepAwake();
    if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(function () {});
    }
  });
}());
</script>

  static/wake.mp4, the wake-lock video, is 1527 bytes of black and was generated with:

    ffmpeg -f lavfi -i color=c=black:s=64x64:r=1:d=2 \
           -c:v libx264 -profile:v baseline -level 3.0 -pix_fmt yuv420p \
           -movflags +faststart -an static/wake.mp4

  If it is ever regenerated, keep those flags. Baseline profile and yuv420p are what
  iOS will play inline, and it refuses anything else, silently: the symptom is a screen
  that sleeps mid-race, which is not something anyone notices at the dock.
