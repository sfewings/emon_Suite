<!doctype html>
<!--
  Race screen. Build order steps 7 and 8: the countdown, the pre-start, and course
  selection with flags.

  Four panels, all of them in the DOM from the start, switched by a class on <body>. Mode
  is server state, so every device switches together and nothing is rebuilt (DESIGN 9.6).

  Asset URLs are relative, not root-relative, on purpose: this page is served both at
  /race/ behind nginx and at / on its own port, and a leading slash breaks the prefixed
  case. The data URL is built from location.pathname for the same reason (CLAUDE.md).
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">  <!-- relative: resolves to /race/ behind nginx and / on the app's own port.
     Declares the scope that keeps both screens in one iOS standalone window;
     apple-mobile-web-app-capable above is what iOS 12 reads instead. -->
<link rel="apple-touch-icon" href="static/icon-180.png">  <!-- iOS takes the Home Screen icon from here; it will not accept an SVG.
     Relative, like every other asset URL on these pages. -->
<title>Enchantee racing</title>
<link rel="stylesheet" href="static/app.css">

<video id="wake" src="static/wake.mp4" muted loop playsinline webkit-playsinline
       preload="auto" disableremoteplayback></video>
<div id="pip"></div>
<div id="notice"></div>

<!--
  The rounding symbols, defined once here and used wherever a rounding is shown: the next
  mark while racing, and the first mark before the start. Defined rather than repeated,
  because the geometry is the thing that must not drift between copies, and a test asserts
  the sweep direction of exactly one copy of it.

  The geometry is the chart's own. The arrow comes from the "port / starboard rounding" row
  of the legend on page 1 of docs/reference/Swan River course marks-Jul26.pdf; the buoy dot
  in its concave side, and the gap around it, are measured off mark 33A, where the chart
  draws the pair together. Sweeping the whole chart finds the same pairing about eighty
  times, mirrored between the two sides, so this is the chart's composite symbol rather
  than an assembly of ours.

  Port sweeps anticlockwise and starboard clockwise, which is the boat's own turn: leaving
  a mark to port means turning to port around it. currentColor throughout, so the night
  theme recolours them with everything else.
-->
<svg id="rnd-defs" width="0" height="0" aria-hidden="true" focusable="false">
  <symbol id="rnd-port-sym" viewBox="0 0 8.911 10.454">
    <path d="M4.984 9.956 C5.703 9.711 6.345 9.284 6.844 8.717 C8.413 6.938 8.22 4.24 6.414 2.692"
          fill="none" stroke="currentColor" stroke-width="0.997"/>
    <path d="M3.222 0.499 L4.673 2.312 L6.189 4.058 L7.21 3.14 L8.294 2.154 L5.758 1.327Z"
          fill="currentColor"/>
    <circle cx="2.9" cy="5.832" r="2.9" fill="currentColor"/>
  </symbol>
  <symbol id="rnd-starboard-sym" viewBox="0 0 8.910 10.451">
    <path d="M3.926 9.952 C3.207 9.708 2.566 9.282 2.067 8.716 C0.498 6.936 0.69 4.238 2.498 2.691"
          fill="none" stroke="currentColor" stroke-width="0.997"/>
    <path d="M5.69 0.499 L4.238 2.312 L2.721 4.058 L1.702 3.14 L0.616 2.154 L3.154 1.327Z"
          fill="currentColor"/>
    <circle cx="6.01" cy="5.828" r="2.9" fill="currentColor"/>
  </symbol>
</svg>

<div id="app">

  <!-- idle: pick a course. Series first, then a card per course with both flags. -->
  <section class="panel" id="panel-idle">
    <div id="series"></div>
    <div id="cards"></div>
    <div class="controls">
      <button id="night">Night</button>
      <!-- Only while a race is live: a way back to it, since choosing a course is not the
           only reason to be looking at this screen (DESIGN 9.6). -->
      <button class="primary" id="resume" hidden>Race</button>
    </div>
  </section>

  <!-- prestart: the countdown, and time to the line against it (DESIGN 10).

       Reached as soon as a course is selected, with the countdown reading dashes until a
       hooter is tapped. The hooter buttons are here, so this panel has to be reachable
       without a timer already set, or there is no way to start a race. -->
  <section class="panel" id="panel-prestart">
    <div class="grow">
      <span class="lbl">to the gun</span>
      <span class="big" id="countdown">--:--</span>
    </div>
    <div class="row">
      <div class="grow">
        <span class="lbl">to the line</span>
        <span class="big" id="line-distance">---</span> <span class="unit" id="line-unit">m</span>
      </div>
      <div class="grow">
        <span class="lbl">time to line</span>
        <span class="big" id="line-time">--:--</span>
      </div>
    </div>
    <!-- Where the boat is going once the gun goes. The engine is already steering at leg 1
         before the start, so this is the same next-mark reading the racing panel shows,
         shown early: it is what decides which end of the line to start at (DESIGN 9.2). -->
    <div class="row">
      <div class="grow">
        <span class="lbl">first mark</span>
        <div class="markline">
          <span id="pre-mark">---</span>
          <span id="pre-round" class="rounding" role="img" hidden>
            <svg class="rnd rnd-port" viewBox="0 0 8.911 10.454" aria-hidden="true">
              <use href="#rnd-port-sym"/></svg>
            <svg class="rnd rnd-starboard" viewBox="0 0 8.910 10.451" aria-hidden="true">
              <use href="#rnd-starboard-sym"/></svg>
          </span>
        </div>
      </div>
      <div class="grow">
        <span class="lbl">distance</span>
        <span class="big" id="pre-distance">---</span> <span class="unit" id="pre-unit">m</span>
      </div>
      <div class="grow">
        <span class="lbl">bearing</span>
        <span class="big" id="pre-bearing">---</span>
      </div>
    </div>
    <div class="controls">
      <button id="hooter-10">T-10</button>
      <button id="hooter-5">T-5</button>
      <button id="hooter-1">T-1</button>
      <!-- The gun, now. For a start that was missed, a hooter that was not heard, and every
           replay and dockside test (DESIGN 9.6). -->
      <button class="primary" id="start-now">Start</button>
    </div>
    <div class="controls">
      <button class="small" id="nudge-minus">-1s</button>
      <button class="small" id="nudge-plus">+1s</button>
      <button id="sync">Sync</button>
      <button id="cancel">Course</button>
    </div>
  </section>

  <!-- racing: next mark, distance, bearing with COG beside it, elapsed (DESIGN 9.2). -->
  <section class="panel" id="panel-racing">
    <div class="grow">
      <span class="lbl">next mark</span>
      <div class="markline">
        <span id="mark-name">---</span>
        <!-- The rounding side, as the chart's own turn symbol rather than the words PORT
             and STARBOARD. The crew reads that glyph off the course-marks chart already,
             and a shape lands faster than a word on a wet screen in sunlight (DESIGN 9.2).

             Both icons are in the DOM and the CSS shows one, the same way the panels work.
             The geometry is in the symbols at the top of this file, used rather than
             repeated, and inline rather than <img> so it takes currentColor. -->
        <span id="mark-round" class="rounding" role="img" hidden>
          <svg class="rnd rnd-port" viewBox="0 0 8.911 10.454" aria-hidden="true">
            <use href="#rnd-port-sym"/></svg>
          <svg class="rnd rnd-starboard" viewBox="0 0 8.910 10.451" aria-hidden="true">
            <use href="#rnd-starboard-sym"/></svg>
        </span>
      </div>
    </div>
    <div class="grow">
      <span class="lbl">distance</span>
      <span class="big" id="distance">---</span> <span class="unit" id="distance-unit">m</span>
    </div>
    <div class="row">
      <div class="grow">
        <span class="lbl">bearing</span>
        <span class="big" id="bearing">---</span>
      </div>
      <div class="grow">
        <span class="lbl">cog</span>
        <span class="big" id="cog">---</span>
      </div>
      <div class="grow">
        <span class="lbl">off the bow</span>
        <span class="big" id="relative">---</span>
      </div>
    </div>
    <div class="grow">
      <span class="lbl">elapsed</span>
      <span class="big" id="elapsed">--:--:--</span>
    </div>
    <div id="secondary"></div>
    <div class="controls">
      <button class="small" id="back">Back</button>
      <button class="small wide" id="detail">Details</button>
      <button class="primary" id="next">Next mark</button>
      <button class="small warn" id="shorten">S</button>
    </div>
  </section>

  <!-- finished: elapsed frozen, the course sailed, and nothing that resets itself. -->
  <section class="panel" id="panel-finished">
    <div class="grow">
      <span class="lbl">finished</span>
      <span class="big" id="final-elapsed">--:--:--</span>
    </div>
    <div class="grow">
      <span class="lbl">course</span>
      <span class="big" id="final-course">---</span>
    </div>
    <div id="final-secondary"></div>
    <div class="controls">
      <button class="primary" id="reset">Course</button>
    </div>
  </section>

  <!-- Course detail: the whole course on one page, every leg of it (DESIGN 9.11).

       Not a screen and not in the navigation. It is opened from a course card, to read a
       course before choosing it, and from the racing panel, to see what is coming after the
       mark ahead. Its only way out is back to whichever of those it was opened from, which
       is why the page remembers where it came from rather than assuming.

       This is the one panel allowed to scroll. Fifteen legs will not fit a phone at a size
       worth reading, and unlike the racing display this is read at rest with two hands
       free, so a scroll here is not the failure it would be there (CLAUDE.md). -->
  <section class="panel" id="panel-detail">
    <div id="detail-head">
      <div class="flags" id="detail-flags"></div>
      <div id="detail-titles">
        <span class="lbl" id="detail-series">---</span>
        <span id="detail-title">---</span>
      </div>
      <div id="detail-distance">---</div>
    </div>
    <div id="detail-notes"></div>
    <div id="detail-legs"></div>
    <div class="controls">
      <button class="primary" id="detail-back">Back</button>
    </div>
  </section>

  <!-- Three screens: HUD, Race, Map. Race is this whole page, and which of its five panels
       shows is the race's business, not the navigation's. Moving between those panels is
       done by the controls that mean something: Back off leg 1 to the course list, Next off
       the last leg to Finish, Course off Finish (DESIGN 9.6). -->
  <nav id="nav">
    <a href="hud">HUD</a>
    <button class="here" data-show="race">Race</button>
    <a class="off" aria-disabled="true">Map</a>
  </nav>

</div>
<script src="static/app.js" defer></script>
