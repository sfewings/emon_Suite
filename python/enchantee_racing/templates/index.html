<!doctype html>
<!--
  Race screen. Build order steps 7 and 8: the countdown, the pre-start, and course
  selection with flags.

  Four panels, all of them in the DOM from the start, switched by a class on <body>. Mode
  is server state, so every device switches together and nothing is rebuilt (DESIGN 9.6).

  Asset URLs are relative, not root-relative, on purpose: this page is served both at
  /race/ behind nginx and at / on its own port, and a leading slash breaks the prefixed
  case. The data URL is built from location.pathname for the same reason (CLAUDE.md).
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Enchantee racing</title>
<link rel="stylesheet" href="static/app.css">

<video id="wake" src="static/wake.mp4" muted loop playsinline webkit-playsinline
       preload="auto" disableremoteplayback></video>
<div id="pip"></div>
<div id="notice"></div>

<div id="app">

  <!-- idle: pick a course. Series first, then a card per course with both flags. -->
  <section class="panel" id="panel-idle">
    <div id="series"></div>
    <div id="cards"></div>
    <div class="controls">
      <button id="night">Night</button>
    </div>
  </section>

  <!-- prestart: the countdown, and time to the line against it (DESIGN 10).

       Reached as soon as a course is selected, with the countdown reading dashes until a
       hooter is tapped. The hooter buttons are here, so this panel has to be reachable
       without a timer already set, or there is no way to start a race. -->
  <section class="panel" id="panel-prestart">
    <div class="grow">
      <span class="lbl">to the gun</span>
      <span class="big" id="countdown">--:--</span>
    </div>
    <div class="row">
      <div class="grow">
        <span class="lbl">to the line</span>
        <span class="big" id="line-distance">---</span> <span class="unit" id="line-unit">m</span>
      </div>
      <div class="grow">
        <span class="lbl">time to line</span>
        <span class="big" id="line-time">--:--</span>
      </div>
    </div>
    <div class="controls">
      <button id="hooter-10">T-10</button>
      <button id="hooter-5">T-5</button>
      <button id="hooter-1">T-1</button>
    </div>
    <div class="controls">
      <button class="small" id="nudge-minus">-1s</button>
      <button class="small" id="nudge-plus">+1s</button>
      <button id="sync">Sync</button>
      <button id="cancel">Course</button>
    </div>
  </section>

  <!-- racing: next mark, distance, bearing with COG beside it, elapsed (DESIGN 9.2). -->
  <section class="panel" id="panel-racing">
    <div class="grow">
      <span class="lbl">next mark</span>
      <div class="markline">
        <span id="mark-name">---</span><span id="mark-round"></span>
      </div>
    </div>
    <div class="grow">
      <span class="lbl">distance</span>
      <span class="big" id="distance">---</span> <span class="unit" id="distance-unit">m</span>
    </div>
    <div class="row">
      <div class="grow">
        <span class="lbl">bearing</span>
        <span class="big" id="bearing">---</span>
      </div>
      <div class="grow">
        <span class="lbl">cog</span>
        <span class="big" id="cog">---</span>
      </div>
      <div class="grow">
        <span class="lbl">off the bow</span>
        <span class="big" id="relative">---</span>
      </div>
    </div>
    <div class="grow">
      <span class="lbl">elapsed</span>
      <span class="big" id="elapsed">--:--:--</span>
    </div>
    <div id="secondary"></div>
    <div class="controls">
      <button class="small" id="back">Back</button>
      <button class="primary" id="next">Next mark</button>
      <button class="small warn" id="shorten">S</button>
    </div>
  </section>

  <!-- finished: elapsed frozen, the course sailed, and nothing that resets itself. -->
  <section class="panel" id="panel-finished">
    <div class="grow">
      <span class="lbl">finished</span>
      <span class="big" id="final-elapsed">--:--:--</span>
    </div>
    <div class="grow">
      <span class="lbl">course</span>
      <span class="big" id="final-course">---</span>
    </div>
    <div id="final-secondary"></div>
    <div class="controls">
      <button class="primary" id="reset">Course</button>
    </div>
  </section>

  <!-- The same navigation on every screen, so no screen is a dead end. Tapping a name is
       a view change and never a command: looking at the course list during a race must not
       end the race (DESIGN 9.6). HUD and Map are separate pages; the other three are
       panels of this one. -->
  <nav id="nav">
    <a href="hud">HUD</a>
    <button data-show="idle">Course</button>
    <button data-show="race">Race</button>
    <button data-show="finished">Finish</button>
    <a class="off" aria-disabled="true">Map</a>
  </nav>

</div>
<script src="static/app.js" defer></script>
