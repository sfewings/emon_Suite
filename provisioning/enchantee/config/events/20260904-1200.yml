# Event Configurations
# Time-based config file following emon_Suite pattern
# Active from: 2026-02-12 10:00

events:
  # Vessel track recording - automatic logging when vessel moves
  track_recording:
    enabled: true
    name: "Vessel Track Recording"
    description: "Automatic logging of track sessions with battery, GPS, temperature, and motor data"

    # GPS position monitoring topics
    monitor_topics:
      # One JSON message per fix, {"lat":.., "lon":.., "ts":..}, published by
      # pyemonlib.emon_mqtt.gpsMessage. Preferred over the separate
      # gps/latitude/0 + gps/longitude/0 topics, which are sampled either side of
      # a fix: a position assembled from those pairs a latitude from one moment
      # with a longitude from another, and movement is detected by distance, so
      # that reads as a jump the vessel never made and triggers a recording that
      # never happened. The split topics are still accepted if this one stops
      # being published.
      - "gps/position/0"

    # Start condition: Vessel moving (GPS position changing)
    start_condition:
      type: "gps_movement"
      distance_threshold: 20             # meters - movement required to trigger
      duration: 5                       # seconds - must move continuously

    # Stop condition: Vessel stopped (GPS position stationary)
    stop_condition:
      type: "gps_stopped"
      distance_threshold: 20              # meters - max movement while "stopped"
      duration: 180                       # seconds - must be stationary continuously

    # MQTT topics to record during session.
    #
    # emon/# is the envelope lane (DESIGN 4.2): one retained JSON message per reading,
    # carrying the feed's group and name, so a plot legend can say "Main Battery / power"
    # rather than "bms/power/1". It replaces the per-node legacy patterns below it
    # (temperature, sevCon, imu, anemometer, bms, pth), which carried the same readings
    # under names nothing could resolve.
    #
    # gps/# and rssi/# are gone too: both are published on the envelope lane as well, and
    # recording both lanes stored every GPS reading twice. The replay showed what that
    # costs — charts pairing 'EMON GPS Latitude' with 'GPS Latitude 0', and a second
    # route map's worth of position rows. The track reader finds its stream by the
    # envelope's node and field now, so it no longer needs the gps/ prefix.
    #
    # The battery/... patterns are gone for a different reason. The boat has no bat
    # shunt; emon_config names that node Unused, so it publishes nothing on either lane,
    # and no line of 20260913_Frostbite_1.TXT carries one.
    #
    # monitor_topics above still names gps/position/0: that is the trigger's own
    # subscription, not a recorded topic, and the legacy lane is still published.
    record_topics:
      - "emon/#"                         # Envelope lane: every named feed, with its name

    # Charts for the post, composed by feed name (emon_live_ui DESIGN 5), drawn in this
    # order and ahead of the automatic ones. Any feed not named here is still grouped
    # automatically, so a sensor added to the boat appears without this being edited.
    #
    # This block used to name raw topics and was never read: every caller passed no
    # plot_config and the processor went straight to auto-generation. It names feeds now
    # because that is the one thing a person editing this file can be expected to know;
    # nobody should have to remember that the pack reports power on emon/bms/1/power.
    # Patterns are fnmatch against the feed name.
    #
    # The route map and the statistics table are NOT listed. Both are produced
    # automatically: the map from whichever GPS stream the recording holds, the table
    # from the computed statistics. Listing them here would draw each twice.
    plots:
      # Everything that measures a temperature, on one chart. Light Banner's channel is
      # named Bimini in emon_config, not 'temperature', so it is named outright.
      - title: "Temperatures"
        # Note the spaces: a feed name is 'group / name', so the pattern needs
        # '* / temperature'. '*/temperature' matches nothing at all.
        feeds:
          - "* / temperature"
          - "SevCon / *Temperature"
          - "Light Banner / Bimini"
        ylabel: "degC"

      # The pack: its total voltage and state of charge against the sixteen cells.
      # Cells are on the right axis because 3.3 V against a 55 V pack on one scale
      # leaves the cells a flat line exactly where a diverging cell would show.
      - title: "Battery and cells"
        feeds:
          - "SevCon / capVoltage"
          - "Main Battery / batteryVoltage"
          - "Main Battery / batterySoC"
        right_feeds:
          - "Main Battery / cellVoltage *"
        ylabel: "Volts, and SoC %"
        right_ylabel: "Cell voltage (V)"

      # What the motor draws against what the pack delivers; amps and watts, so two axes.
      - title: "Motor current and battery power"
        feeds:
          - "SevCon / batteryCurrent"
        right_feeds:
          - "Main Battery / power"
        ylabel: "Current (A)"
        right_ylabel: "Power (W)"

      # Boat speed against the three wind sources, all in knots already.
      - title: "Boat speed and wind speed"
        feeds:
          - "Enchantee-GPS / speed"
          - "*wind / windSpeed"
        ylabel: "Knots"

      # Attitude from the IMU's accelerometer, as angles of the gravity vector.
      #
      # Roll is emon_feed.heel, atan2(y, z), and its sign was measured on a recorded
      # race. Pitch follows from the axis convention (x bow-stern, y port-starboard)
      # but its sign has NOT been checked against a known moment: verify it on a
      # recording where the bow is known to have lifted before trusting it.
      #
      # Heave is not here and cannot be. It needs vertical acceleration integrated
      # twice, which wants 10-50 Hz and a high-pass filter to stop the drift; this IMU
      # reports at about 1 Hz, so a two-second wave is already at Nyquist and the sea
      # state aliases away. The result would look like heave without being heave.
      - title: "Pitch and roll"
        feeds:
          - "derived/roll"
          - "derived/pitch"
        ylabel: "Degrees"

    # Recorded, but not worth a chart of its own.
    skip_feeds:
      - "Light Banner / supplyV"
      - "Main Battery / resCapacity"

    # Export files generated during processing and attached to the WordPress post
    exports:
      # csv off: a full-day recording writes a quarter-gigabyte of it, which is
      # more than the uplink can publish and more than the Pi wants to keep.
      csv: false
      kml: true
      gpx: true

    # WordPress publishing settings
    wordpress:
      site: "default_site"               # Reference to wordpress.default_site in main config
      category: "Track Logs"
      auto_publish: true                # Manual review before publish
      template: |
        <h2>Track Summary</h2>
        <p><strong>Date:</strong> {start_time}</p>
        <p><strong>Duration:</strong> {duration}</p>
        <p><strong>Distance:</strong> {distance} km</p>
        <p><strong>Max Speed:</strong> {max_speed} km/h</p>
        <p><strong>Average Speed:</strong> {avg_speed} km/h</p>
        <p><strong>Energy Used:</strong> {energy_used} Wh</p>
        <p><strong>Efficiency:</strong> {efficiency} Wh/km</p>

        <h3>Performance Plots</h3>
        {plots}


  # Anchor-based track recording: starts when the vessel leaves the mooring and
  # stops when it is back. One recording spans the whole outing, which is what a
  # blog post describes, so it is the one the post editor opens (editor_default).
  # track_recording, above, records the same sail by movement and can split a day
  # at every long stop.
  anchor_track_recording:
    enabled: true
    name: "Anchor-Based Recording"
    # The event page (/race/log/) opens this event's recording when more than one
    # is running (event_recorder FR-28). A flag rather than a key in the code,
    # because these files are versioned by date and an event can be renamed.
    editor_default: true
    description: "Record when vessel departs from home anchor and stop when it returns"

    monitor_topics:
      # One JSON message per fix, {"lat":.., "lon":.., "ts":..}, published by
      # pyemonlib.emon_mqtt.gpsMessage. Preferred over the separate
      # gps/latitude/0 + gps/longitude/0 topics, which are sampled either side of
      # a fix: a position assembled from those pairs a latitude from one moment
      # with a longitude from another, and movement is detected by distance, so
      # that reads as a jump the vessel never made and triggers a recording that
      # never happened. The split topics are still accepted if this one stops
      # being published.
      - "gps/position/0"

    # Start condition: Vessel has moved outside the anchor zone
    start_condition:
      type: "anchor_departure"
      anchor_lat: -32.001378                # Home latitude
      anchor_lon: 115.809363                # Home longitude
      radius: 50                            # meters - zone radius around anchor
      duration: 5                           # seconds outside zone before triggering

    # Stop condition: Vessel has returned inside the anchor zone
    stop_condition:
      type: "anchor_return"
      anchor_lat: -32.001378                # Home latitude
      anchor_lon: 115.809363                # Home longitude
      radius: 50                            # meters - zone radius around anchor
      duration: 15                          # seconds inside zone before triggering

    # As track_recording above: emon/# is the envelope lane and carries the feed names.
    # race/# is the exception that stays: enchantee_racing publishes it directly, so it
    # goes through no decoder and has no envelope.
    record_topics:
      - "emon/#"                         # Envelope lane: every named feed, with its name
      - "race/#"                         # Race events from enchantee_racing: starts, roundings, finish (FR-30)

    # Charts for the post, composed by feed name (emon_live_ui DESIGN 5), drawn in this
    # order and ahead of the automatic ones. Any feed not named here is still grouped
    # automatically, so a sensor added to the boat appears without this being edited.
    #
