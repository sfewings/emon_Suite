# /etc/NetworkManager/dnsmasq-shared.d/enchantee.conf
#
# Read by the dnsmasq instance NetworkManager starts for an ipv4.method=shared
# connection (the "Enchantee" hotspot).
#
# avahi already answers enchantee.local over mDNS, which covers iOS, macOS,
# Windows and Linux. This line answers the same name over ordinary unicast DNS,
# for clients that send .local to the configured resolver rather than
# multicasting it -- Android in particular, whose mDNS hostname resolution is
# unreliable. The two paths do not conflict: mDNS-first clients resolve the
# name before dnsmasq is ever asked.
#
# The address must match ipv4.addresses on the enchantee connection profile.
address=/enchantee.local/10.42.0.1
