services:
  influxdb:
    image: arm32v7/influxdb:latest
    container_name: influx
    ports:
      - '8086:8086'
    volumes:
      - influxdb-storage:/var/lib/influxdb
      - /share/influxdb/influxdb_backup:/backups
    environment:
      - INFLUXDB_DB=sensors
      - INFLUXDB_ADMIN_USER=${INFLUXDB_USERNAME}
      - INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_PASSWORD}
      - INFLUXDB_HTTP_FLUX_ENABLED=true
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana1
    ports:
      - '3000:3000'
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana-provisioning/:/etc/grafana/provisioning
    depends_on:
      - influxdb
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USERNAME}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_PANELS_ENABLE_ALPHA=true
      - GF_SERVER_ROOT_URL=${GRAFANA_URL}
      - GF_SERVER_DOMAIN=${DOMAIN_NAME}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_ALLOW_UI_UPDATES=true
    restart: always

  mosquitto:
    image: eclipse-mosquitto
    container_name: mqtt
    ports:
      - 1883:1883
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/logs
      - ./mosquitto-config:/mosquitto/config
    restart: always

  emon_mqtt_to_log:
    image: sfewings32/emon_mqtt_to_log:latest
    container_name: emon_log
    volumes:
      - /share/Input:/share/Input
    depends_on:
      - mosquitto
    environment:
      - MQTT_IP=mqtt
      - TZ=${TIMEZONE}
    restart: always

  emon_gpsd_to_mqtt:
    image: sfewings32/emon_gpsd_to_mqtt:latest
    container_name: emon_gpsd
    # Use host network to access the gpsd service that should be running. Then set MQTT_IP to localhost instead of mqtt
    network_mode: "host"    
    volumes:
      - ./emon_config:/data
      - /share/Input:/share/Input
    environment:
      - SETTINGS_PATH=/data/emon_config.yml
      - LOG_PATH=/share/Input/gps
      - MQTT_IP=localhost
      - GPS_NODE_NUMBER=1
      - TZ=${TIMEZONE}
    depends_on:
      - mosquitto
    restart: always

  emon_serial_to_mqtt:
    image: sfewings32/emon_serial_to_mqtt:latest
    container_name: emon_serial
    devices:
      - /dev/ttyAMA0  #/dev/ttyUSB0
    environment:
      - SETTINGS_PATH=/data/emon_config.yml
      - SERIAL_PORT=/dev/ttyAMA0   #/dev/ttyUSB0
      - MQTT_IP=mqtt
      - TZ=${TIMEZONE}
    volumes:
      - ./emon_config:/data
      - /share/Output:/share/Output
    depends_on:
      - mosquitto
    restart: always

  emon_mqtt_to_influx:
    image: sfewings32/emon_mqtt_to_influx:latest
    container_name: emon_influx
    volumes:
      - ./emon_config:/share/config
    environment:
      - MQTT_IP=mqtt
      - INFLUX_IP=influxdb
      - SETTINGS_PATH=/share/config/emon_config.yml
    depends_on:
      - influxdb
      - mosquitto
    restart: always

  emon_settings_web:
    image: sfewings32/emon_settings_web:latest
    container_name: emon_settings_web
    ports:
      - '5001:5000'
    volumes:
      - ./emon_config:/config
    environment:
      - EMON_CONFIG=/config
      - TZ=${TIMEZONE}
      - FLASK_APP=emon_settings_web.py
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/api/settings/current')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s      
    restart: unless-stopped

  node-red:
    image: nodered/node-red:latest
    container_name: node_red
    environment:
      - TZ=${TIMEZONE}
    entrypoint: /data/entrypoint.sh
    ports:
      - "1880:1880"
    volumes:
      - /share/emon-node-red:/data
      - /share:/share
      # rslave so a USB drive mounted on the host after this container starts
      # shows up inside it. With the default rprivate the backup flow only sees
      # the bare mount point directory.
      - /media:/containermedia:rslave
    depends_on:
      - mosquitto
    restart: always

  emon_logtojson:
    image: sfewings32/emon_logtojson:latest
    container_name: emon_logtojson
    volumes:
      - /share:/share
    environment:
      - TZ=${TIMEZONE}
      - MQTT_IP=mqtt
      - REPROCESS_LOGS_FROM_YEAR=this
    depends_on:
      - mosquitto
    restart: always

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    # Served behind nginx at http://enchantee.local/portainer/
    command: --base-url=/portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer-data:/data
    ports:
      - 9000:9000
      - 9443:9443

  event_recorder:
    image: sfewings32/emon_event_recorder:latest
    container_name: event_recorder
    # Host networking to reach mosquitto and gpsd on localhost. That also puts
    # the web interface on the host's port 5000, which is where nginx proxies
    # http://enchantee.local/events/ to; no published port is needed.
    network_mode: "host"
    #ports:
    #  - "5001:5000"
    volumes:
      - ./config:/config
      - ./data:/data
    environment:
#      - MQTT_BROKER=localhost
#      - MQTT_PORT=1883
      - WP_SITE_URL=${WP_SITE_URL}
      - WP_USERNAME=${WP_USERNAME}
      - WP_APP_PASSWORD=${WP_APP_PASSWORD}
      - WP_WHITELIST_ENDPOINT=${WP_WHITELIST_ENDPOINT}
      - TZ=${TIMEZONE}
      #- DEBUG=1  # Set DEBUG=1 to enable debugpy
      #- WAIT_FOR_DEBUGGER=1  # Set WAIT_FOR_DEBUGGER=1 to wait for debugger
    depends_on:
      - mosquitto
    restart: unless-stopped

  enchantee_racing:
    image: sfewings32/emon_enchantee_racing:latest
    container_name: enchantee_racing
    # Host networking, for the same two reasons as event_recorder above. It reaches
    # mosquitto on localhost:1883, and it puts the Flask app on the host's port 5002,
    # which is where nginx proxies http://enchantee.local/race/ to. No published port
    # is needed, and the app keeps its default 127.0.0.1 bind so the only way in is
    # through nginx.
    network_mode: "host"
    volumes:
      # The whole application directory, not just config/. Everything the app serves
      # is then editable in place, which is the point: course data changes year to
      # year (DESIGN 7) and CLAUDE.md requires the front end be editable from a laptop
      # on a jetty. The image carries its own copy of all of this, so it still runs if
      # the mount is absent; the mount shadows it.
      #
      # Read-write on purpose. The config editor in DESIGN 13 step 10 is designed as
      # PUT /api/config/{marks|courses|lines} and writes these files, so making this
      # read-only now would mean editing compose again to land that feature.
      - /share/emon_Suite/python/enchantee_racing:/app
    environment:
      - MQTT_IP=localhost
      - MQTT_PORT=1883
      - BIND_HOST=127.0.0.1
      - SERVICE_PORT=5002
      - TZ=${TIMEZONE}
    depends_on:
      - mosquitto
    # always rather than unless-stopped: this is a boat appliance that has to come
    # back by itself after the batteries are switched off (CLAUDE.md, Stack).
    restart: always

volumes:
  influxdb-storage:
  grafana-storage:
  mosquitto-data:
  mosquitto-logs:
  mosquitto-conf:
  portainer-data:
  mysql-data:
