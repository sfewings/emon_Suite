imu:
  0:
    name: IMU Sensor
    # Which way each accelerometer, gyro and magnetometer axis points on this boat.
    # The decoder puts the field in front, so these name nine feeds:
    # 'IMU Sensor / acc fore-aft', 'IMU Sensor / gyro vertical' and so on. Mounted
    # orientation is a fact about this installation, which is what emon_config is for,
    # and naming it here carries it in every envelope instead of leaving consumers to
    # hard-code that index 0 is the bow-stern axis.
    #
    # Heel is atan2(port-starboard, vertical) and its sign was measured on a recorded
    # race, so these three are not guesses: see emon-ui/derived.yml.
    axis0: fore-aft
    axis1: port-starboard
    axis2: vertical
