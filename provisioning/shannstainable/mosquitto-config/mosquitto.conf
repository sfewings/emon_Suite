listener 1883
allow_anonymous true

# Keep retained messages across a broker restart or a reset of the Pi. The emon/...
# envelopes and emon/config are retained (docs on branch emon_live_ui, DESIGN 4.2), and
# without this every page went blank after a restart until each node next transmitted.
persistence true
persistence_location /mosquitto/data/
# Saved every 5 minutes as well as on a clean stop, so a hard reset loses at most that.
autosave_interval 300
