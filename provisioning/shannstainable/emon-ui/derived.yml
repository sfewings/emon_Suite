# shannstainable derived feeds (emon_live, DESIGN 6.3; operators in python/emon_live/derived.py).
#
# Ported from Node-RED's Instant data tab (docs/emon_live_ui/INVENTORY.md section 2), as
# it computed them on 21 Oct 2026, the owner's decisions in HANDOVER applied: the export
# estimate is kept as Node-RED made it; month and year rain come from Influx; battery
# mid-point maxima are computed here. Where this differs from Node-RED on purpose, the
# entry says so.
#
# Pulse counters are already Wh (the nodes apply pN_wPerPulse), as Node-RED assumed.

# Derived feeds that Node-RED publishes, not this file (DESIGN D5): bespoke state machines
# on its Instant data tab, function "Publish emon_live results" (emon-node-red, branch
# emon_live_ui). Listed so the page linter knows them before they first arrive.
external:
  - derived/hws/showers/today       # flows of hot water over 3 min since midnight
  - derived/hws/showerTime/today    # minutes of hot water flow since midnight
  - derived/dog/lastFed             # when the scale last dropped 150 g, s since the epoch
  - derived/tank/daysRemaining      # at the rolling 7-day average use
  - derived/tank/averageUse         # mm a day, that average

# Where each input lives in Influx (measurement, sensor tag), so a restart replays today.
influx:
  Power board / HWS (pulse):                          pulse pulse/0/0
  Power board / Consumed (pulse):                     pulse pulse/0/2
  Power board / Imported (pulse):                     pulse pulse/0/3
  Power board / Car (pulse):                          pulse pulse/0/4
  Power board / Imported:                             power power/0/3
  Power board / Car:                                  power power/0/4
  Inverter One / pvInputPower:                        power inverter/pvInputPower/0
  Inverter Three / pvInputPower:                      power inverter/pvInputPower/1
  Inverter Two / pvInputPower:                        power inverter/pvInputPower/2
  Hot water system / Inlet (T6):                      temperature temperature/HWS/2
  Rain tank and HWS / Hot water:                      water water/flowCount/0/0
  Rain tank and HWS / Rain water tank:                tank water/height/0/0
  Rain gauge / rain:                                  rain rain
  Main battery monitor / Rail:                        voltage battery/voltage/0/0
  Main battery monitor / B2-5:                        voltage battery/voltage/1/0
  Main battery monitor / B2-4:                        voltage battery/voltage/5/0
  Main battery monitor / B2-3:                        voltage battery/voltage/6/0
  Main battery monitor / B2-2:                        voltage battery/voltage/7/0
  Main battery monitor / B2-1:                        voltage battery/voltage/8/0
  LiFePO monitor 5 / Battery-510Ah:                   power battery/power/0/5
  LiFePO monitor 5 / Battery-320Ah:                   power battery/power/1/5
  LiFePO monitor 5 / Battery-280Ah:                   power battery/power/2/5
  LiFePO monitor 5 / Battery-510Ah (pulseIn):         pulse battery/pulseIn/0/5
  LiFePO monitor 5 / Battery-320Ah (pulseIn):         pulse battery/pulseIn/1/5
  LiFePO monitor 5 / Battery-280Ah (pulseIn):         pulse battery/pulseIn/2/5
  LiFePO monitor 5 / Battery-510Ah (pulseOut):        pulse battery/pulseOut/0/5
  LiFePO monitor 5 / Battery-320Ah (pulseOut):        pulse battery/pulseOut/1/5
  LiFePO monitor 5 / Battery-280Ah (pulseOut):        pulse battery/pulseOut/2/5
  LiFePO monitor 4 / Inverter 1:                      power battery/power/0/4
  LiFePO monitor 4 / Inverter 2:                      power battery/power/1/4
  LiFePO monitor 4 / Inverter 3:                      power battery/power/2/4
  LiFePO monitor 4 / Inverter 1 (pulseIn):            pulse battery/pulseIn/0/4
  LiFePO monitor 4 / Inverter 2 (pulseIn):            pulse battery/pulseIn/1/4
  LiFePO monitor 4 / Inverter 3 (pulseIn):            pulse battery/pulseIn/2/4
  LiFePO monitor 4 / Inverter 1 (pulseOut):           pulse battery/pulseOut/0/4
  LiFePO monitor 4 / Inverter 2 (pulseOut):           pulse battery/pulseOut/1/4
  LiFePO monitor 4 / Inverter 3 (pulseOut):           pulse battery/pulseOut/2/4
  Dog food / scale:                                   scale scale/0
  Leaf / odometer:                                    leaf leaf/odometer/0
  Outlander / odometer:                               leaf leaf/odometer/1

derived:
  # --- Power now (Calculate Instant power) -------------------------------------------
  # Inverter One and Three are on the batteries; Inverter Two is not.
  - id: solar/now
    op: sum
    of: [Inverter One / pvInputPower, Inverter Two / pvInputPower, Inverter Three / pvInputPower]
    unit: W
    kind: power

  # Node-RED's export estimate, kept as it is (owner, 21 Oct 2026): Inverter Two's output
  # less the average of every positive import reading since midnight. Not night-time only,
  # whatever its comment says; 0 before the first import of the day.
  - id: import/average
    op: mean
    feed: Power board / Imported
    positive_only: true
    unit: W
    kind: power
  - id: export/now
    op: expr
    expr: "max(0, {Inverter Two / pvInputPower} - {derived/import/average})"
    defaults: {derived/import/average: 0}
    unit: W
    kind: power
    decimals: 0

  # Check if charging: car charging at 200 W or more.
  - id: car/charging
    op: expr
    expr: "{Power board / Car} >= 200"
    kind: state

  # --- Energy today (Accumulate daily usage, Calculate solar production) ---------------
  - {id: hws/today,      op: daily_delta, feed: Power board / HWS (pulse),      unit: Wh}
  - {id: consumed/today, op: daily_delta, feed: Power board / Consumed (pulse), unit: Wh}
  - {id: import/today,   op: daily_delta, feed: Power board / Imported (pulse), unit: Wh}
  - {id: car/today,      op: daily_delta, feed: Power board / Car (pulse),      unit: Wh}

  # Node-RED integrated each inverter's PV as a backward rectangle per message; this is
  # the trapezoid rule, with gaps over 5 min not bridged (DESIGN 6.3).
  - {id: inverter1/today, op: integrate, feed: Inverter One / pvInputPower}
  - {id: inverter2/today, op: integrate, feed: Inverter Two / pvInputPower}
  - {id: inverter3/today, op: integrate, feed: Inverter Three / pvInputPower}

  # Solar today, all three inverters integrated. Node-RED took Inverter Two from the
  # Schneider pulse meter (pulse/0/1), which no longer works (owner, 21 Oct 2026), so its
  # figure left Inverter Two out.
  - id: solar/today
    op: sum
    of: [derived/inverter1/today, derived/inverter2/today, derived/inverter3/today]
    unit: Wh
    kind: energy
    decimals: 0

  # --- Export and foregone (Calculate daily exported) ----------------------------------
  - {id: export/today, op: integrate, feed: derived/export/now, decimals: 0}

  # What Inverters One and Three would have made at Inverter Two's yield, in W.
  # Node-RED rounded each 2-second step to whole Wh, which dropped everything under 900 W;
  # integrated unrounded here, so this reads higher than Node-RED's figure, which the
  # owner had long found suspiciously low.
  - id: foregone/now
    op: expr
    expr: >-
      (max(0, {Inverter Two / pvInputPower} * 1.19 - {Inverter One / pvInputPower})
       + max(0, {Inverter Two / pvInputPower} * 1.11 - {Inverter Three / pvInputPower}))
      if {Inverter Two / pvInputPower} > 0 else 0
    unit: W
    kind: power
  - {id: foregone/today, op: integrate, feed: derived/foregone/now, decimals: 0}

  # --- Costs ($/kWh as Node-RED had them; site config, not code) ----------------------
  - {id: import/cost/today,    op: expr, expr: "{derived/import/today} / 1000 * 0.262",    unit: "$", kind: money, decimals: 2}
  - {id: hws/cost/today,       op: expr, expr: "{derived/hws/today} / 1000 * 0.262",       unit: "$", kind: money, decimals: 2}
  - {id: car/cost/today,       op: expr, expr: "{derived/car/today} / 1000 * 0.262",       unit: "$", kind: money, decimals: 2}
  - {id: export/value/today,   op: expr, expr: "{derived/export/today} / 1000 * 0.07135",  unit: "$", kind: money, decimals: 2}
  - {id: foregone/value/today, op: expr, expr: "{derived/foregone/today} / 1000 * 0.07135", unit: "$", kind: money, decimals: 2}

  # --- Hot water (Current water temperatures, Accumulate daily water usage) ------------
  # Shower minutes left in the tank. Node-RED gave negative minutes from 40 to 44 degC and
  # "Too cold" under 40; here 0 under 45, and the page can say "Too cold".
  - id: hws/showerMinutes
    op: expr
    expr: "max(0, round(({Hot water system / Inlet (T6)} - 45) / 0.7))"
    unit: min
    kind: time
  - {id: water/hot/today, op: daily_delta, feed: Rain tank and HWS / Hot water, unit: L, kind: volume, decimals: 0}
  # Mains and bore (wtr subnode 1) are not working (owner, 21 Oct 2026); add them when
  # they are.

  # --- Rain (Calculate D,M,Y rainfalls). The gauge's envelope is already mm. -----------
  - {id: rain/today,    op: daily_delta, feed: Rain gauge / rain, unit: mm, kind: rain, decimals: 1}
  - {id: rain/since9am, op: daily_delta, feed: Rain gauge / rain, reset: "09:00", unit: mm, kind: rain, decimals: 1}
  # From Influx's first value since the 1st, not Node-RED's text files (owner, 21 Oct 2026).
  - {id: rain/month,    op: daily_delta, feed: Rain gauge / rain, reset: month, unit: mm, kind: rain, decimals: 1}
  - {id: rain/year,     op: daily_delta, feed: Rain gauge / rain, reset: year,  unit: mm, kind: rain, decimals: 1}

  # --- Rain water tank (Calculate Rain water details) ----------------------------------
  # 460 mm is empty, 2050 mm full. Days remaining stays in Node-RED (DESIGN D5). The
  # height sensor is not working (owner, 21 Oct 2026), so this reads 0 until it is.
  - id: tank/percent
    op: expr
    expr: "max(0, round(({Rain tank and HWS / Rain water tank} - 460) / (2050 - 460) * 100))"
    unit: "%"
    kind: level

  # --- Main battery voltages (Battery Voltage). Computed here, owner 21 Oct 2026. -------
  - {id: battery/rail/max, op: daily_max, feed: Main battery monitor / Rail, unit: V, kind: voltage}
  - {id: battery/rail/min, op: daily_min, feed: Main battery monitor / Rail, unit: V, kind: voltage}
  # Worst mid-point of the day per channel, by magnitude, ignoring 0 (a disconnected tap).
  # Node-RED kept the raw reading, not reading minus half the rail, and so does this.
  - {id: battery/midpoint/B2-5/max, op: daily_max, feed: Main battery monitor / B2-5, abs: true, ignore_zero: true, unit: V, kind: voltage, decimals: 3}
  - {id: battery/midpoint/B2-4/max, op: daily_max, feed: Main battery monitor / B2-4, abs: true, ignore_zero: true, unit: V, kind: voltage, decimals: 3}
  - {id: battery/midpoint/B2-3/max, op: daily_max, feed: Main battery monitor / B2-3, abs: true, ignore_zero: true, unit: V, kind: voltage, decimals: 3}
  - {id: battery/midpoint/B2-2/max, op: daily_max, feed: Main battery monitor / B2-2, abs: true, ignore_zero: true, unit: V, kind: voltage, decimals: 3}
  - {id: battery/midpoint/B2-1/max, op: daily_max, feed: Main battery monitor / B2-1, abs: true, ignore_zero: true, unit: V, kind: voltage, decimals: 3}
  # Node-RED's "Healthy", or the channels over 1 V: here the count of them, 0 is healthy.
  - id: battery/midpoint/over1V
    op: expr
    expr: >-
      (abs({derived/battery/midpoint/B2-5/max}) > 1) + (abs({derived/battery/midpoint/B2-4/max}) > 1)
      + (abs({derived/battery/midpoint/B2-3/max}) > 1) + (abs({derived/battery/midpoint/B2-2/max}) > 1)
      + (abs({derived/battery/midpoint/B2-1/max}) > 1)
    defaults:
      derived/battery/midpoint/B2-5/max: 0
      derived/battery/midpoint/B2-4/max: 0
      derived/battery/midpoint/B2-3/max: 0
      derived/battery/midpoint/B2-2/max: 0
      derived/battery/midpoint/B2-1/max: 0
    kind: count

  # --- LiFePO batteries, monitor 5 (Battery Current, Battery power) -------------------
  # The monitors count positive current on pulseIn and negative on pulseOut. On monitor 5
  # positive is OUT of the battery (discharging, at night) and negative is INTO it
  # (charging, by day), so pulseIn is discharge and pulseOut is charge. Checked against
  # integrated power on 21 Oct 2026 (night: pulseIn 52/199/175 Wh against +54/+202/+176 Wh;
  # day: pulseOut 465/623/794 Wh against -444/-628/-807 Wh). Node-RED read them the other
  # way round, so its "battery in" was discharge and its "out to 9am" was morning charge.
  - {id: battery/510Ah/in/today,  op: daily_delta, feed: LiFePO monitor 5 / Battery-510Ah (pulseOut), unit: Wh}
  - {id: battery/320Ah/in/today,  op: daily_delta, feed: LiFePO monitor 5 / Battery-320Ah (pulseOut), unit: Wh}
  - {id: battery/280Ah/in/today,  op: daily_delta, feed: LiFePO monitor 5 / Battery-280Ah (pulseOut), unit: Wh}
  - {id: battery/510Ah/out/today, op: daily_delta, feed: LiFePO monitor 5 / Battery-510Ah (pulseIn),  unit: Wh}
  - {id: battery/320Ah/out/today, op: daily_delta, feed: LiFePO monitor 5 / Battery-320Ah (pulseIn),  unit: Wh}
  - {id: battery/280Ah/out/today, op: daily_delta, feed: LiFePO monitor 5 / Battery-280Ah (pulseIn),  unit: Wh}
  - id: battery/in/today
    op: sum
    of: [derived/battery/510Ah/in/today, derived/battery/320Ah/in/today, derived/battery/280Ah/in/today]
    unit: Wh
    kind: energy
  - id: battery/out/today
    op: sum
    of: [derived/battery/510Ah/out/today, derived/battery/320Ah/out/today, derived/battery/280Ah/out/today]
    unit: Wh
    kind: energy
  # Discharged from midnight to 09:00, shown from 09:00 until 09:00 tomorrow.
  - {id: battery/510Ah/out/to9am, op: window_delta, feed: LiFePO monitor 5 / Battery-510Ah (pulseIn), end: "09:00", unit: Wh}
  - {id: battery/320Ah/out/to9am, op: window_delta, feed: LiFePO monitor 5 / Battery-320Ah (pulseIn), end: "09:00", unit: Wh}
  - {id: battery/280Ah/out/to9am, op: window_delta, feed: LiFePO monitor 5 / Battery-280Ah (pulseIn), end: "09:00", unit: Wh}
  - id: battery/out/to9am
    op: sum
    of: [derived/battery/510Ah/out/to9am, derived/battery/320Ah/out/to9am, derived/battery/280Ah/out/to9am]
    unit: Wh
    kind: energy
  # Battery power now: positive is out of the battery (discharging), negative into it.
  - id: battery/power/in
    op: expr
    expr: "max(0, -{LiFePO monitor 5 / Battery-510Ah}) + max(0, -{LiFePO monitor 5 / Battery-320Ah}) + max(0, -{LiFePO monitor 5 / Battery-280Ah})"
    unit: W
    kind: power
  - id: battery/power/out
    op: expr
    expr: "max(0, {LiFePO monitor 5 / Battery-510Ah}) + max(0, {LiFePO monitor 5 / Battery-320Ah}) + max(0, {LiFePO monitor 5 / Battery-280Ah})"
    unit: W
    kind: power

  # --- Inverter shunts, monitor 4 (Inverters Current, Inverter power) -----------------
  # Mounted the other way: positive is INTO the battery, so here pulseIn is charge and
  # pulseOut discharge, as Node-RED had it (night: pulseOut 242 Wh against -241 Wh; day:
  # pulseIn 1045 Wh against +1041 Wh, Inverter 1, 21 Oct 2026).
  - {id: inverter/1/in/today,  op: daily_delta, feed: LiFePO monitor 4 / Inverter 1 (pulseIn),  unit: Wh}
  - {id: inverter/2/in/today,  op: daily_delta, feed: LiFePO monitor 4 / Inverter 2 (pulseIn),  unit: Wh}
  - {id: inverter/3/in/today,  op: daily_delta, feed: LiFePO monitor 4 / Inverter 3 (pulseIn),  unit: Wh}
  - {id: inverter/1/out/today, op: daily_delta, feed: LiFePO monitor 4 / Inverter 1 (pulseOut), unit: Wh}
  - {id: inverter/2/out/today, op: daily_delta, feed: LiFePO monitor 4 / Inverter 2 (pulseOut), unit: Wh}
  - {id: inverter/3/out/today, op: daily_delta, feed: LiFePO monitor 4 / Inverter 3 (pulseOut), unit: Wh}
  - id: inverter/in/today
    op: sum
    of: [derived/inverter/1/in/today, derived/inverter/2/in/today, derived/inverter/3/in/today]
    unit: Wh
    kind: energy
  - id: inverter/out/today
    op: sum
    of: [derived/inverter/1/out/today, derived/inverter/2/out/today, derived/inverter/3/out/today]
    unit: Wh
    kind: energy
  # Opposite sign to monitor 5: positive is into the battery.
  - id: inverter/power/in
    op: expr
    expr: "max(0, {LiFePO monitor 4 / Inverter 1}) + max(0, {LiFePO monitor 4 / Inverter 2}) + max(0, {LiFePO monitor 4 / Inverter 3})"
    unit: W
    kind: power
  - id: inverter/power/out
    op: expr
    expr: "max(0, -{LiFePO monitor 4 / Inverter 1}) + max(0, -{LiFePO monitor 4 / Inverter 2}) + max(0, -{LiFePO monitor 4 / Inverter 3})"
    unit: W
    kind: power

  # --- Dog food (Get last reading time): what is on the scale, as Node-RED showed it ---
  # When the dog was last fed is Node-RED's (external, above).
  - {id: dog/food/kg, op: expr, expr: "{Dog food / scale} / 1000", unit: kg, kind: mass, decimals: 1}

  # --- Cars (Calculate car details); the rest of that node is page display -------------
  - {id: car/leaf/kmToday,      op: daily_delta, feed: Leaf / odometer,      unit: km, kind: distance, decimals: 0}
  - {id: car/outlander/kmToday, op: daily_delta, feed: Outlander / odometer, unit: km, kind: distance, decimals: 0}
